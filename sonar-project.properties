sonar.sources=app,routes,database,scanner/app
sonar.tests=tests
sonar.test.inclusions=tests/**/*.php
# scanner/vendor: codigo de terceiros vendorizado sem alteracao (veja scanner/NOTICE.md).
sonar.exclusions=vendor/**,storage/**,bootstrap/cache/**,scanner/vendor/**,scanner/.venv/**
sonar.coverage.exclusions=database/**,routes/**,app/Models/**
sonar.php.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8
