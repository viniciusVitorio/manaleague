name: EKS lab checks and deploy

on:
  workflow_call:
    secrets:
      # Lab-only values, never the production APP_KEY.
      LAB_APP_KEY:
        required: true
      LAB_DEMO_PASSWORD:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eks-lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    needs: gate
    # A disabled SSDLC call must not launch a second build pipeline.
    # Direct manual dispatch still supports local-only validation.
    if: ${{ !cancelled() && needs.gate.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.enabled == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: manaleague_test
          POSTGRES_USER: manaleague
          POSTGRES_PASSWORD: local-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U manaleague -d manaleague_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: manaleague_test
      DB_USERNAME: manaleague
      DB_PASSWORD: local-test-password
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare isolated test environment (never copy production credentials)
        run: cp .env.example .env
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pdo_sqlite, intl, gd, exif
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: php artisan test
      - run: node --test tests/js/*.test.cjs
      - run: composer audit --locked --no-interaction
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.37.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.19.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Install pinned local validators
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
      - name: Validate workflows, scripts, isolated Terraform and Kubernetes schemas (no cloud API)
        run: bash infra/eks-lab/scripts/verify.sh
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  images:
    # Never build on a disabled SSDLC call; manual offline checks remain available.
    if: ${{ !cancelled() && needs.checks.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.gate.outputs.enabled == 'true') }}
    runs-on: ubuntu-latest
    needs: [checks, gate]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build both lab targets once
        run: |
          docker build -f infra/eks-lab/docker/Dockerfile --target app -t lab-app:dev .
          docker build -f infra/eks-lab/docker/Dockerfile --target web -t lab-web:dev .
      - name: Smoke tested local images (never build during publish)
        run: bash infra/eks-lab/scripts/smoke.sh
      - name: Verify PostgreSQL TLS using disposable local certificates (no AWS)
        run: bash infra/eks-lab/local/test-tls-fixture.sh
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: lab-app:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          image-ref: lab-web:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Export the exact smoke-tested images
        if: needs.gate.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lab-images"
          docker save lab-app:dev lab-web:dev | gzip -1 > "$RUNNER_TEMP/lab-images/images.tar.gz"
          cd "$RUNNER_TEMP/lab-images"
          sha256sum images.tar.gz > images.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.gate.outputs.enabled == 'true'
        with:
          name: eks-lab-images-${{ github.sha }}
          path: ${{ runner.temp }}/lab-images/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  gate:
    timeout-minutes: 5
    if: github.repository == 'viniciusVitorio/manaleague' && github.ref == 'refs/heads/eks-lab' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: eks-lab
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      broker_enabled: ${{ steps.gate.outputs.broker_enabled }}
      runner_label: ${{ steps.gate.outputs.runner_label }}
      account: ${{ vars.AWS_ACCOUNT_ID }}
      region: ${{ vars.AWS_REGION }}
    steps:
      - id: gate
        env:
          LAB_DEPLOY_ENABLED: ${{ vars.LAB_DEPLOY_ENABLED }}
          LAB_DEPLOY_BROKER_ENABLED: ${{ vars.LAB_DEPLOY_BROKER_ENABLED }}
          LAB_CODEBUILD_RUNNER_ENABLED: ${{ vars.LAB_CODEBUILD_RUNNER_ENABLED }}
          CODEBUILD_RUNNER_LABEL: codebuild-manaleague-eks-lab-runner-${{ github.run_id }}-${{ github.run_attempt }}
          LEGACY_RUNNER_LABEL: eks-lab-${{ github.run_id }}
        run: |
          if [[ "$LAB_DEPLOY_BROKER_ENABLED" == true ]]; then
            echo 'broker_enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'broker_enabled=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$LAB_CODEBUILD_RUNNER_ENABLED" == true ]]; then
            echo "runner_label=$CODEBUILD_RUNNER_LABEL" >> "$GITHUB_OUTPUT"
          else
            echo "runner_label=$LEGACY_RUNNER_LABEL" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$LAB_DEPLOY_ENABLED" == true ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Cloud jobs disabled. Provision the isolated lab and configure the eks-lab Environment and authorized runner before enabling deployment.' >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    if: needs.gate.outputs.enabled == 'true' && github.repository == 'viniciusVitorio/manaleague' && github.ref == 'refs/heads/eks-lab' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [checks, images, gate]
    runs-on: ubuntu-latest
    environment: eks-lab
    permissions:
      contents: read
      id-token: write
    outputs:
      app_image: ${{ steps.publish.outputs.app_image }}
      web_image: ${{ steps.publish.outputs.web_image }}
    env:
      LAB_DEPLOY_ENABLED: ${{ vars.LAB_DEPLOY_ENABLED }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_APP_REPOSITORY: ${{ vars.ECR_APP_REPOSITORY }}
      ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: eks-lab-images-${{ github.sha }}
          path: ${{ runner.temp }}/lab-images
      - name: Verify and load tested image artifact
        working-directory: ${{ runner.temp }}/lab-images
        run: |
          set -euo pipefail
          sha256sum -c images.tar.gz.sha256
          gzip -dc images.tar.gz | docker load
      - name: Reject wrong lab role before requesting OIDC credentials
        run: |
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_ROLE_ARN" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/manaleague-eks-lab-github-deploy" ]]
          [[ "$EKS_CLUSTER_NAME" == manaleague-eks-lab && "$LAB_DEPLOY_ENABLED" == true ]]
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          unset-current-credentials: true
          role-session-name: eks-lab-publish-${{ github.run_id }}
      - name: Publish immutable SHA tags, verify existing retries, emit digests
        id: publish
        run: bash infra/eks-lab/scripts/lab.sh publish --allow-cloud --confirm-lab manaleague-eks-lab --expected-account "$AWS_ACCOUNT_ID"

  deploy:
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.broker_enabled != 'true' && github.repository == 'viniciusVitorio/manaleague' && github.ref == 'refs/heads/eks-lab' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [publish, gate]
    # Per-run routing is not authorization; provision only after explicit approval.
    # CodeBuild is opt-in only after its webhook and isolated project are secured.
    # Never open the cluster endpoint to hosted-runner IPs dynamically.
    runs-on: [self-hosted, linux, "${{ needs.gate.outputs.runner_label }}"]
    environment: eks-lab
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: manaleague-eks-lab-deploy
      cancel-in-progress: false
    env:
      LAB_DEPLOY_ENABLED: ${{ vars.LAB_DEPLOY_ENABLED }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      ECR_APP_REPOSITORY: ${{ vars.ECR_APP_REPOSITORY }}
      ECR_WEB_REPOSITORY: ${{ vars.ECR_WEB_REPOSITORY }}
      APP_IMAGE: ${{ needs.publish.outputs.app_image }}
      WEB_IMAGE: ${{ needs.publish.outputs.web_image }}
      RELEASE: ${{ github.sha }}
      APP_URL: ${{ vars.APP_URL }}
      ACM_CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
      MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
      AVATAR_BUCKET: ${{ vars.AVATAR_BUCKET }}
      APP_ROLE_ARN: ${{ vars.APP_ROLE_ARN }}
      VPC_CIDR: ${{ vars.VPC_CIDR }}
      SUBNET_IDS: ${{ vars.SUBNET_IDS }}
      ALLOWED_CIDRS: ${{ vars.ALLOWED_CIDRS }}
      ALB_SECURITY_GROUP_ID: ${{ vars.ALB_SECURITY_GROUP_ID }}
      APP_KEY: ${{ secrets.LAB_APP_KEY }}
      DB_HOST: ${{ vars.DB_HOST }}
      VPC_ID: ${{ vars.VPC_ID }}
      RDS_MASTER_SECRET_ARN: ${{ vars.RDS_MASTER_SECRET_ARN }}
      DEMO_PASSWORD: ${{ secrets.LAB_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Reject wrong lab role before requesting OIDC credentials
        run: |
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_ROLE_ARN" == "arn:aws:iam::${AWS_ACCOUNT_ID}:role/manaleague-eks-lab-github-deploy" ]]
          [[ "$EKS_CLUSTER_NAME" == manaleague-eks-lab && "$LAB_DEPLOY_ENABLED" == true ]]
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          unset-current-credentials: true
          role-session-name: eks-lab-deploy-${{ github.run_id }}
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: v1.37.0
      - name: Guard exact cluster, render, migrate, discover ALB URL and verify HTTP/WebSocket
        run: bash infra/eks-lab/scripts/lab.sh deploy --allow-cloud --confirm-lab manaleague-eks-lab --expected-account "$AWS_ACCOUNT_ID"

  release_source:
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.broker_enabled == 'true' && github.repository == 'viniciusVitorio/manaleague' && github.ref == 'refs/heads/eks-lab' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [checks, images, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      source_sha256: ${{ steps.archive.outputs.source_sha256 }}
    env:
      AWS_ACCOUNT_ID: ${{ needs.gate.outputs.account }}
      AWS_REGION: ${{ needs.gate.outputs.region }}
      RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build tracked deploy source from exact release
        id: archive
        run: |
          set -euo pipefail
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ && "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]$ ]]
          [[ "$RELEASE" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$RELEASE" ]]
          git archive --format=zip "$RELEASE" infra/eks-lab/scripts infra/eks-lab/kubernetes > "$RUNNER_TEMP/deploy-source.zip"
          SOURCE_SHA256="$(sha256sum "$RUNNER_TEMP/deploy-source.zip" | cut -d' ' -f1)"
          [[ "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "source_sha256=$SOURCE_SHA256" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::${{ needs.gate.outputs.account }}:role/manaleague-eks-lab-release-publisher
          aws-region: ${{ needs.gate.outputs.region }}
          unset-current-credentials: true
          role-session-name: eks-lab-source-${{ github.run_id }}
      - name: Upload content-addressed source
        env:
          SOURCE_SHA256: ${{ steps.archive.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          aws s3api put-object --bucket "manaleague-eks-lab-releases-${AWS_ACCOUNT_ID}-${AWS_REGION}" --key "releases/${RELEASE}/${SOURCE_SHA256}.zip" --body "$RUNNER_TEMP/deploy-source.zip" --region "$AWS_REGION" > /dev/null

  # Experimental: infrastructure remains separately blocked pending review.
  deploy_broker:
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.broker_enabled == 'true' && github.repository == 'viniciusVitorio/manaleague' && github.ref == 'refs/heads/eks-lab' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [publish, gate, release_source]
    runs-on: ubuntu-latest
    environment: eks-lab
    # Includes setup and time for a best-effort stop after the client deadline.
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: manaleague-eks-lab-deploy
      cancel-in-progress: false
    env:
      LAB_DEPLOY_ENABLED: ${{ vars.LAB_DEPLOY_ENABLED }}
      LAB_DEPLOY_BROKER_ENABLED: ${{ vars.LAB_DEPLOY_BROKER_ENABLED }}
      LAB_DEPLOY_BROKER_ROLE_ARN: ${{ vars.LAB_DEPLOY_BROKER_ROLE_ARN }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      SOURCE_SHA256: ${{ needs.release_source.outputs.source_sha256 }}
      RELEASE: ${{ github.sha }}
      APP_IMAGE: ${{ needs.publish.outputs.app_image }}
      WEB_IMAGE: ${{ needs.publish.outputs.web_image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate broker inputs before requesting credentials
        run: python3 infra/eks-lab/orchestrator/workflow_broker.py --check
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.LAB_DEPLOY_BROKER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          unset-current-credentials: true
          role-session-name: eks-lab-broker-${{ github.run_id }}
      - name: Start broker and fail unless deployment succeeds
        run: python3 infra/eks-lab/orchestrator/workflow_broker.py

  deploy_outcome:
    name: Require a successful lab deployment on push
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/eks-lab' }}
    needs: [gate, publish, deploy, deploy_broker]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail closed when deployment did not succeed
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          ENABLED: ${{ needs.gate.outputs.enabled }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          BROKER_RESULT: ${{ needs.deploy_broker.result }}
        run: |
          if [[ "$GATE_RESULT" == success && "$ENABLED" == true && "$PUBLISH_RESULT" == success ]] &&
             { [[ "$DEPLOY_RESULT" == success && "$BROKER_RESULT" == skipped ]] || [[ "$DEPLOY_RESULT" == skipped && "$BROKER_RESULT" == success ]]; }; then
            echo 'Lab deployment completed successfully.'
          else
            echo 'Lab deployment was disabled, skipped, cancelled, or failed.' >&2
            exit 1
          fi
