# ManaLeague — excecoes em runtime, antes das regras do OWASP CRS.
# Command Tower + Search for Tomorrow em linhas diferentes dispara falsos positivos
# de comandos Unix: 932230, 932235, 932250 e 932340 (audit log do CRS 4.25.2).
# Somente o campo list de POST /me/decks/{id}/import recebe a excecao.
# O importador consulta nomes no Scryfall, usa Eloquent e nunca executa esse texto.
# As demais regras (inclusive SQLi/XSS) e todos os outros campos continuam ativos.
SecRule REQUEST_METHOD "@streq POST" \
    "id:10001,phase:1,pass,nolog,t:none,chain"
    SecRule REQUEST_URI "@rx ^/me/decks/[0-9]+/import(?:\?.*)?$" \
        "t:none,ctl:ruleRemoveTargetById=932230;ARGS:list,ctl:ruleRemoveTargetById=932235;ARGS:list,ctl:ruleRemoveTargetById=932250;ARGS:list,ctl:ruleRemoveTargetById=932340;ARGS:list"
