# ManaLeague — excecoes carregadas DEPOIS das regras do OWASP CRS (ModSecurity v3).
# Montado em /etc/modsecurity.d/owasp-crs/rules/ pelo docker-compose; o CRS inclui rules/*.conf em
# ordem alfabetica, entao este arquivo (999) vem depois de todas as regras que ele ajusta.
#
# Os demais ajustes do CRS vem por variavel de ambiente da imagem (docker-compose.yml, servico waf):
#   BLOCKING_PARANOIA=1, ANOMALY_INBOUND=5, ALLOWED_METHODS (+ PUT PATCH DELETE),
#   MODSEC_RULE_ENGINE (On | DetectionOnly), limites de corpo e SecResponseBodyAccess Off.
#
# Regra da casa: cada excecao tira UM campo da inspecao; nunca desligar uma regra inteira para o site todo.

# Senhas podem ter qualquer caractere (ex.: ' " < > --); viram hash bcrypt e nunca sao exibidas nem montam SQL.
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:password"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:password_confirmation"
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:current_password"

# Token CSRF e cookies do Laravel sao valores aleatorios/criptografados (base64 com = e %); o app valida a assinatura.
SecRuleUpdateTargetByTag "OWASP_CRS" "!ARGS:_token"
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:manaleague_session"
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:XSRF-TOKEN"
SecRuleUpdateTargetByTag "OWASP_CRS" "!REQUEST_COOKIES:/^remember_web_/"
