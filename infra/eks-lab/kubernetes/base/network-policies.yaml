{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "default-deny-ingress",
    "namespace": "manaleague-eks-lab"
  },
  "spec": {
    "podSelector": {},
    "policyTypes": [
      "Ingress"
    ]
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "app-ingress",
    "namespace": "manaleague-eks-lab"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app": "manaleague"
      }
    },
    "policyTypes": [
      "Ingress"
    ],
    "ingress": [
      {
        "from": [
          {
            "ipBlock": {
              "cidr": "__VPC_CIDR__"
            }
          },
          {
            "podSelector": {}
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 8080
          }
        ]
      }
    ]
  }
}
---
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "reverb-ingress",
    "namespace": "manaleague-eks-lab"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app": "reverb"
      }
    },
    "policyTypes": [
      "Ingress"
    ],
    "ingress": [
      {
        "from": [
          {
            "ipBlock": {
              "cidr": "__VPC_CIDR__"
            }
          },
          {
            "podSelector": {
              "matchLabels": {
                "role": "app"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 8080
          }
        ]
      }
    ]
  }
}
