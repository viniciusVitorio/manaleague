{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "manaleague-config",
    "namespace": "manaleague-eks-lab"
  },
  "data": {
    "APP_NAME": "ManaLeague EKS Lab",
    "APP_ENV": "eks-lab",
    "APP_DEBUG": "false",
    "APP_URL": "__APP_URL__",
    "LOG_CHANNEL": "stderr",
    "LOG_LEVEL": "warning",
    "DB_CONNECTION": "pgsql",
    "LAB_DATABASE_MODE": "rds",
    "DB_HOST": "__DB_HOST__",
    "DB_PORT": "5432",
    "DB_DATABASE": "manaleague_eks_lab",
    "DB_USERNAME": "manaleague_lab",
    "DB_URL": "",
    "DB_SSLMODE": "verify-full",
    "PGSSLROOTCERT": "/var/www/html/infra/eks-lab/runtime/certs/global-bundle.pem",
    "SESSION_DRIVER": "database",
    "SESSION_COOKIE": "manaleague_eks_lab_session",
    "SESSION_ENCRYPT": "true",
    "SESSION_SECURE_COOKIE": "false",
    "SESSION_HTTP_ONLY": "true",
    "SESSION_SAME_SITE": "lax",
    "CACHE_STORE": "database",
    "CACHE_PREFIX": "manaleague-eks-lab-",
    "QUEUE_CONNECTION": "sync",
    "MAIL_MAILER": "log",
    "MAIL_FROM_ADDRESS": "demo@manaleague.test",
    "AVATAR_DISK": "s3",
    "AWS_BUCKET": "__AVATAR_BUCKET__",
    "AWS_DEFAULT_REGION": "__AWS_REGION__",
    "AWS_EC2_METADATA_DISABLED": "true",
    "BROADCAST_CONNECTION": "reverb",
    "REVERB_HOST": "reverb",
    "REVERB_PORT": "8080",
    "REVERB_SCHEME": "http"
  }
}
