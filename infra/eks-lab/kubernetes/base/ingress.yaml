{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "Ingress",
  "metadata": {
    "name": "manaleague",
    "namespace": "manaleague-eks-lab",
    "annotations": {
      "alb.ingress.kubernetes.io/load-balancer-name": "manaleague-eks-lab",
      "alb.ingress.kubernetes.io/security-groups": "__ALB_SECURITY_GROUP_ID__",
      "alb.ingress.kubernetes.io/manage-backend-security-group-rules": "false",
      "alb.ingress.kubernetes.io/scheme": "internet-facing",
      "alb.ingress.kubernetes.io/target-type": "ip",
      "alb.ingress.kubernetes.io/listen-ports": "[{\"HTTP\":80}]",
      "alb.ingress.kubernetes.io/inbound-cidrs": "__ALLOWED_CIDRS__",
      "alb.ingress.kubernetes.io/subnets": "__SUBNET_IDS__",
      "alb.ingress.kubernetes.io/healthcheck-path": "/readyz",
      "alb.ingress.kubernetes.io/success-codes": "200",
      "alb.ingress.kubernetes.io/load-balancer-attributes": "routing.http.xff_header_processing.mode=append,routing.http.xff_client_port.enabled=false",
      "alb.ingress.kubernetes.io/target-group-attributes": "deregistration_delay.timeout_seconds=30",
      "alb.ingress.kubernetes.io/tags": "Project=manaleague-eks-lab",
      "alb.ingress.kubernetes.io/actions.deny-api": "{\"type\":\"fixed-response\",\"fixedResponseConfig\":{\"contentType\":\"text/plain\",\"statusCode\":\"404\",\"messageBody\":\"Not found\"}}"
    }
  },
  "spec": {
    "ingressClassName": "alb",
    "rules": [
      {
        "http": {
          "paths": [
            {
              "path": "/apps",
              "pathType": "Prefix",
              "backend": {
                "service": {
                  "name": "deny-api",
                  "port": {
                    "name": "use-annotation"
                  }
                }
              }
            },
            {
              "path": "/app",
              "pathType": "Prefix",
              "backend": {
                "service": {
                  "name": "reverb",
                  "port": {
                    "number": 8080
                  }
                }
              }
            },
            {
              "path": "/",
              "pathType": "Prefix",
              "backend": {
                "service": {
                  "name": "manaleague",
                  "port": {
                    "number": 80
                  }
                }
              }
            }
          ]
        }
      }
    ]
  }
}
